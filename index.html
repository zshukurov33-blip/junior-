<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Neon Highway 3D</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }
        body {
            background: #05010c;
            color: #fff;
            font-family: 'Segoe UI', sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        /* 3D Poyga Maydoni */
        #gameViewport {
            position: relative;
            width: 480px;
            height: 600px;
            border: 4px solid #ff007f;
            box-shadow: 0 0 40px rgba(255, 0, 127, 0.4);
            border-radius: 24px;
            background: linear-gradient(to bottom, #110426 0%, #05010c 100%);
            overflow: hidden;
            perspective: 350px; /* Realistik yo'l perspektivasi */
        }
        .hud {
            position: absolute;
            top: 25px;
            width: 100%;
            text-align: center;
            z-index: 100;
            pointer-events: none;
        }
        .speedometer {
            font-size: 2rem;
            font-weight: 900;
            color: #ff007f;
            text-shadow: 0 0 15px #ff007f;
            letter-spacing: 2px;
        }
        /* 3D Istiqbolli Yo'l */
        #highway {
            position: absolute;
            bottom: 0;
            left: 10%;
            width: 80%;
            height: 60%;
            background: #0d061f;
            border-left: 6px solid #00f2fe;
            border-right: 6px solid #00f2fe;
            box-shadow: 0 0 30px rgba(0, 242, 254, 0.3);
            transform: rotateX(65deg);
            transform-origin: bottom center;
        }
        .road-line {
            position: absolute;
            left: 49%;
            width: 2%;
            height: 40px;
            background: #00f2fe;
            box-shadow: 0 0 10px #00f2fe;
        }
        /* Neon Sport Mashinasi */
        #playerCar {
            position: absolute;
            bottom: 40px;
            left: 200px;
            width: 80px;
            height: 50px;
            background: linear-gradient(to top, #ff007f, #ff00ff);
            border-radius: 8px 8px 4px 4px;
            box-shadow: 0 0 25px #ff007f;
            z-index: 50;
            pointer-events: none;
            transition: transform 0.1s ease, left 0.1s ease;
        }
        /* Faralar yorug'ligi */
        .taillight {
            position: absolute;
            bottom: 4px;
            width: 15px;
            height: 6px;
            background: #00f2fe;
            box-shadow: 0 0 12px #00f2fe;
        }
        .tl-left { left: 8px; }
        .tl-right { right: 8px; }
        /* 3D To'siq Mashinalar / Bloklar */
        .obstacle3d {
            position: absolute;
            width: 60px;
            height: 45px;
            background: linear-gradient(to bottom, #00ff66, #00aa44);
            box-shadow: 0 0 20px #00ff66;
            border-radius: 6px;
        }
        .controls-hint {
            position: absolute;
            bottom: 15px;
            color: rgba(255, 0, 127, 0.6);
            font-size: 0.85rem;
            text-align: center;
            width: 100%;
            pointer-events: none;
        }
        /* Crash Ekran */
        .game-over-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(5, 1, 12, 0.96);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 200;
        }
        .game-over-screen h2 {
            font-size: 3rem;
            color: #ff007f;
            text-shadow: 0 0 25px #ff007f;
            margin-bottom: 10px;
            letter-spacing: 4px;
        }
        .restart-btn {
            margin-top: 30px;
            padding: 12px 35px;
            font-size: 1.1rem;
            font-weight: bold;
            background: transparent;
            border: 2px solid #00f2fe;
            color: #00f2fe;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.3);
            transition: all 0.3s;
        }
        .restart-btn:hover {
            background: #00f2fe;
            color: #000;
            box-shadow: 0 0 30px #00f2fe;
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <div id="gameViewport">
        <div class="hud">
            <div class="speedometer" id="scoreDisplay">SPEED: 0 km/h</div>
        </div>

        <div id="highway"></div>
        <div id="playerCar">
            <div class="taillight tl-left"></div>
            <div class="taillight tl-right"></div>
        </div>

        <div class="game-over-screen" id="gameOverScreen">
            <h2>HIGHWAY CRASH</h2>
            <div class="speedometer" id="finalScoreDisplay">SCORE: 0</div>
            <button class="restart-btn" id="restartBtn">RESTART RACE</button>
        </div>
    </div>

    <div class="controls-hint">Boshqarish: Sichqonchani suring (Mashina o'ngga-chapga o'ta silliq buriladi)</div>

    <script>
        const viewport = document.getElementById('gameViewport');
        const highway = document.getElementById('highway');
        const playerCar = document.getElementById('playerCar');
        const scoreDisplay = document.getElementById('scoreDisplay');
        const finalScoreDisplay = document.getElementById('finalScoreDisplay');
        const gameOverScreen = document.getElementById('gameOverScreen');
        const restartBtn = document.getElementById('restartBtn');

        let score = 0;
        let isGameOver = false;
        let targetX = 200;
        let currentX = 200;
        
        let roadLines = [];
        let obstacles = [];
        let loopInterval, spawnInterval, lineInterval;

        const areaWidth = 480;
        const carWidth = 80;

        // Sichqoncha orqali mashinani silliq burish
        viewport.addEventListener('mousemove', (e) => {
            if (isGameOver) return;
            const rect = viewport.getBoundingClientRect();
            targetX = e.clientX - rect.left - (carWidth / 2);

            // Yo'l chetidan chiqib ketmaslik cheklovlari
            if (targetX < 60) targetX = 60;
            if (targetX > areaWidth - carWidth - 60) targetX = areaWidth - carWidth - 60;
        });

        // Yo'l chiziqlarini harakatlantirish (Tezlik effekti)
        function spawnRoadLine() {
            if (isGameOver) return;
            const line = document.createElement('div');
            line.className = 'road-line';
            line.style.top = '-40px';
            highway.appendChild(line);
            roadLines.push(line);
        }

        // To'siq mashinalarni 3D uzoqlikdan chiqarish
        function spawnObstacle() {
            if (isGameOver) return;
            const obs = document.createElement('div');
            obs.className = 'obstacle3d';
            
            // Yo'l perspektivasiga mos ravishda markazga yaqin joylashadi
            let lane = Math.floor(Math.random() * 3); // 3 ta yo'lak
            let oX = 110 + lane * 100; 
            let z = -400; // Uzoq ufqdan boshlanadi

            obs.style.left = oX + 'px';
            obs.style.top = '220px'; // Ufq chizig'i
            obs.style.transform = `translateZ(${z}px)`;
            
            viewport.appendChild(obs);
            obstacles.push({ element: obs, x: oX, y: 220, z: z });
        }

        function update() {
            if (isGameOver) return;

            score += 2;
            scoreDisplay.textContent = "SPEED: " + (120 + Math.floor(score/10)) + " km/h";

            // Lerp algoritmi bilan mashinani o'ta silliq surish va burish
            let deltaX = targetX - currentX;
            currentX += deltaX * 0.15;
            
            let tilt = deltaX * 0.8; // Burilganda mashinaning yonboshga qiyshayishi
            if (tilt > 20) tilt = 20;
            if (tilt < -20) tilt = -20;

            playerCar.style.left = currentX + 'px';
            playerCar.style.transform = `rotateY(${tilt}deg) rotateZ(${tilt/2}deg)`;

            // Yo'l chiziqlari harakati
            for (let i = roadLines.length - 1; i >= 0; i--) {
                let line = roadLines[i];
                let cTop = parseInt(line.style.top);
                if (cTop > 400) {
                    line.remove();
                    roadLines.splice(i, 1);
                } else {
                    line.style.top = (cTop + 8) + 'px';
                }
            }

            // 3D To'siqlar harakati va to'qnashuv
            for (let i = obstacles.length - 1; i >= 0; i--) {
                let obs = obstacles[i];
                obs.z += 10; // Yaqinlashish tezligi
                obs.y += 0.6; // Yo'l bo'ylab pastga siljishi

                // Perspektivani kengaytirish effekti
                obs.element.style.transform = `translateZ(${obs.z}px)`;
                obs.element.style.top = obs.y + 'px';

                // To'siq mashina yoniga kelganda to'qnashuvni aniqlash
                if (obs.z >= -30 && obs.z <= 20) {
                    let oRect = obs.element.getBoundingClientRect();
                    let pRect = playerCar.getBoundingClientRect();

                    if (!(oRect.right < pRect.left + 15 || 
                          oRect.left > pRect.right - 15 || 
                          oRect.bottom < pRect.top + 10 || 
                          oRect.top > pRect.bottom - 10)) {
                        
                        endGame();
                        return;
                    }
                }

                // Yo'ldan o'tib ketgan to'siqlarni o'chirish
if (obs.z > 60) {
obs.element.remove();
obstacles.splice(i, 1);
}
}
}
function endGame() {
isGameOver = true;
clearInterval(loopInterval);
clearInterval(spawnInterval);
clearInterval(lineInterval);
finalScoreDisplay.textContent = "SCORE: " + score + " PTS";
gameOverScreen.style.display = 'flex';
}
function startGame() {
document.querySelectorAll('.obstacle3d').forEach(o => o.remove());
document.querySelectorAll('.road-line').forEach(l => l.remove());
obstacles = [];
roadLines = [];
score = 0;
isGameOver = false;
scoreDisplay.textContent = "SPEED: 120 km/h";
gameOverScreen.style.display = 'none';
currentX = 200;
targetX = 200;
playerCar.style.left = currentX + 'px';
playerCar.style.transform = rotateY(0deg);
clearInterval(loopInterval);
clearInterval(spawnInterval);
clearInterval(lineInterval);
loopInterval = setInterval(update, 20);
spawnInterval = setInterval(spawnObstacle, 900); // Har 0.9 soniyada yangi to'siq
lineInterval = setInterval(spawnRoadLine, 150);
}
restartBtn.addEventListener('click', startGame);
startGame();
