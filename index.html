<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Neon Shooter</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }
        body {
            background: #020208;
            color: #fff;
            font-family: 'Segoe UI', sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        #gameCanvas {
            border: 2px solid #00f2fe;
            box-shadow: 0 0 30px rgba(0, 242, 254, 0.3);
            background: #050515;
        }
        .ui-container {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            pointer-events: none;
        }
        .score {
            font-size: 2rem;
            font-weight: bold;
            color: #00f2fe;
            text-shadow: 0 0 10px rgba(0, 242, 254, 0.8);
        }
        .controls-hint {
            position: absolute;
            bottom: 20px;
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.9rem;
        }
        .game-over-screen {
            position: absolute;
            display: none;
            flex-direction: column;
            align-items: center;
            background: rgba(5, 5, 21, 0.85);
            padding: 40px;
            border-radius: 16px;
            border: 1px solid #ff007f;
            box-shadow: 0 0 40px rgba(255, 0, 127, 0.4);
            text-align: center;
        }
        .game-over-screen h2 {
            font-size: 3rem;
            color: #ff007f;
            text-shadow: 0 0 15px rgba(255, 0, 127, 0.8);
            margin-bottom: 20px;
        }
        .restart-btn {
            margin-top: 20px;
            padding: 12px 30px;
            font-size: 1.2rem;
            background: linear-gradient(45deg, #00f2fe, #4facfe);
            border: none;
            color: #000;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s;
            pointer-events: auto;
        }
        .restart-btn:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <div class="ui-container">
        <div class="score" id="scoreDisplay">SCORE: 0</div>
    </div>

    <canvas id="gameCanvas" width="480" height="640"></canvas>

    <div class="game-over-screen" id="gameOverScreen">
        <h2>GAME OVER</h2>
        <div class="score" id="finalScoreDisplay">SCORE: 0</div>
        <button class="restart-btn" onclick="resetGame()">Qaytadan boshlash</button>
    </div>

    <div class="controls-hint">Boshqarish: Sichqonchani suring (kema ergashadi) va chap tugmani bosing (otish)</div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreDisplay = document.getElementById('scoreDisplay');
        const finalScoreDisplay = document.getElementById('finalScoreDisplay');
        const gameOverScreen = document.getElementById('gameOverScreen');

        let score = 0;
        let isGameOver = false;

       
        const player = {
            x: canvas.width / 2 - 20,
            y: canvas.height - 60,
            width: 40,
            height: 40,
            color: '#00f2fe'
        };

        let lasers = [];
        let asteroids = [];
        let particles = [];

        
        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            const rootX = e.clientX - rect.left;
            player.x = rootX - player.width / 2;
            
          
            if (player.x < 0) player.x = 0;
            if (player.x > canvas.width - player.width) player.x = canvas.width - player.width;
        });

        
        canvas.addEventListener('click', () => {
            if (isGameOver) return;
            lasers.push({
                x: player.x + player.width / 2 - 3,
                y: player.y,
                width: 6,
                height: 15,
                color: '#ff007f',
                speed: 8
            });
        });

        
        function createParticles(x, y, color) {
            for (let i = 0; i < 8; i++) {
                particles.push({
                    x: x,
                    y: y,
                    radius: Math.random() * 3 + 1,
                    color: color,
                    speedX: (Math.random() - 0.5) * 4,
                    speedY: (Math.random() - 0.5) * 4,
                    alpha: 1
                });
            }
        }

      
        function spawnAsteroid() {
            if (isGameOver) return;
            const size = Math.random() * 30 + 20;
            asteroids.push({
                x: Math.random() * (canvas.width - size),
                y: -size,
                width: size,
                height: size,
                color: '#e2e2e2',
                speed: Math.random() * 2 + 1.5
            });

            setTimeout(spawnAsteroid, Math.random() * 1000 + 800);
        }

        function rectIntersect(rect1, rect2) {
            return rect1.x < rect2.x + rect2.width &&
                   rect1.x + rect1.width > rect2.x &&
                   rect1.y < rect2.y + rect2.height &&
                   rect1.y + rect1.height > rect2.y;
        }

        function update() {
            if (isGameOver) return;

          
            lasers.forEach((laser, index) => {
                laser.y -= laser.speed;
                if (laser.y < 0) lasers.splice(index, 1);
            });

         
            asteroids.forEach((asteroid, aIndex) => {
                asteroid.y += asteroid.speed;

                if (rectIntersect(player, asteroid)) {
                    endGame();
                }

              
                if (asteroid.y > canvas.height) {
                    asteroids.splice(aIndex, 1);
                }

        
                lasers.forEach((laser, lIndex) => {
                    if (rectIntersect(laser, asteroid)) {
                        createParticles(asteroid.x + asteroid.width/2, asteroid.y + asteroid.height/2, '#ff007f');
                        asteroids.splice(aIndex, 1);
                        lasers.splice(lIndex, 1);
                        score += 10;
                        scoreDisplay.textContent = `SCORE: ${score}`;
                    }
                });
            });

       
            particles.forEach((p, index) => {
                p.x += p.speedX;
                p.y += p.speedY;
                p.alpha -= 0.02;
                if (p.alpha <= 0) particles.splice(index, 1);
            });
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = 'rgba(255,255,255,0.1)';
            for (let i = 0; i < 5; i++) {
                ctx.fillRect(Math.random() * canvas.width, Math.random() * canvas.height, 2, 2);
            }

           
            ctx.shadowBlur = 15;
            ctx.shadowColor = player.color;
            ctx.fillStyle = player.color;
            ctx.beginPath();
            ctx.moveTo(player.x + player.width / 2, player.y);
            ctx.lineTo(player.x, player.y + player.height);
            ctx.lineTo(player.x + player.width, player.y + player.height);
            ctx.closePath();
            ctx.fill();

           
            ctx.shadowColor = '#ff007f';
            lasers.forEach(laser => {
                ctx.fillStyle = laser.color;
                ctx.fillRect(laser.x, laser.y, laser.width, laser.height);
            });

            asteroids.forEach(asteroid => {
                ctx.shadowColor = '#00ff66';
                ctx.fillStyle = '#00ff66';
                ctx.beginPath();
                ctx.arc(asteroid.x + asteroid.width/2, asteroid.y + asteroid.height/2, asteroid.width/2, 0, Math.PI * 2);
                ctx.fill();
            });

            
            particles.forEach(p => {
                ctx.save();
                ctx.globalAlpha = p.alpha;
                ctx.shadowBlur = 5;
                ctx.shadowColor = p.color;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            });

            ctx.shadowBlur = 0; 
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        function endGame() {
            isGameOver = true;
            finalScoreDisplay.textContent = `SCORE: ${score}`;
            gameOverScreen.style.display = 'flex';
        }

        function resetGame() {
            score = 0;
            isGameOver = false;
            lasers = [];
            asteroids = [];
            particles = [];
            scoreDisplay.textContent = `SCORE: 0`;
            gameOverScreen.style.display = 'none';
        }

        
        spawnAsteroid();
